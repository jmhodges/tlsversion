# Desired state for tlsversion in the `prod` namespace of the `dg` GKE cluster.
#
# This file is the source of truth: CI substitutes the freshly-built image
# digest in place of the `__IMAGE__` sentinel and runs `kubectl apply`, so every
# field below is reconciled on every deploy to main. There is no manual
# `kubectl edit` drift to worry about.
#
# To apply by hand (e.g. for a config change you want to test before merging):
#   IMAGE=us-central1-docker.pkg.dev/personal-sites-1295/deploys/tlsversion:latest
#   sed "s|__IMAGE__|$IMAGE|g" k8s/deployment.yaml | kubectl apply -f -
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tlsversion
  namespace: prod
  labels:
    app: tlsversion
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: tlsversion
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 0
  minReadySeconds: 15
  template:
    metadata:
      labels:
        app: tlsversion
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: tlsversion
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 10443
            - name: http
              containerPort: 8080
            # HTTP/3 (QUIC) shares the HTTPS port number but on UDP.
            - name: http3
              containerPort: 10443
              protocol: UDP
          env:
            # Consumed by the Dockerfile ENTRYPOINT:
            #   -canonicalDomain=$TLSVERSION_DOMAIN
            #   -acmeRedirect=$ACME_REDIRECT_URL
            - name: TLSVERSION_DOMAIN
              value: www.tlsversion.com
            - name: ACME_REDIRECT_URL
              value: http://le.somethingsimilar.com/
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              # No CPU limit on purpose: the 50m request already guarantees
              # fair scheduling, and a CPU limit would invite CFS throttling on
              # the latency-sensitive redirect path. The memory limit caps this
              # container so a leak OOM-kills it rather than starving neighbors.
              memory: 64Mi
          # `/healthcheck` is served by the plaintext mux on the http port, so
          # probes don't need to deal with the self-signed-at-rest TLS cert.
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # Give the load balancer time to drop this pod before it stops
            # serving, so in-flight requests aren't cut off during a rollout.
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          volumeMounts:
            - name: tlsversion-tls
              mountPath: /secrets/tlsversion-tls
              readOnly: true
      volumes:
        - name: tlsversion-tls
          secret:
            secretName: tlsversion-tls
---
# TCP (HTTPS + HTTP) and UDP (HTTP/3) are two separate Services on purpose,
# both claiming the same static IP. Two reasons, learned the hard way:
#
#  1. GKE's default external network load balancer (the target-pool kind)
#     refuses mixed-protocol Services: the service controller loops on
#     "mixed protocol is not supported for LoadBalancer" and never provisions
#     the UDP forwarding rule. GCP is happy to attach one TCP and one UDP
#     forwarding rule to the same regional static IP, so one Service per
#     protocol gets us both.
#
#  2. Client-side `kubectl apply` (what CI runs) merges Service ports on
#     `port` alone, not port+protocol, so a 443/TCP entry and a 443/UDP entry
#     in one Service silently collapse into a single port. Keeping the
#     protocols in separate Services means no Service ever has two entries
#     with the same port number.
apiVersion: v1
kind: Service
metadata:
  name: tlsversion-tcp
  namespace: prod
  labels:
    app: tlsversion
spec:
  # The pod terminates TLS itself on 10443 and redirects :8080 -> https, so the
  # LoadBalancer passes both ports straight through. The tlsversion.com DNS A
  # record points at this IP, which is reserved as the static address
  # `tlsversion-lb` in us-central1.
  type: LoadBalancer
  loadBalancerIP: 34.42.103.207
  selector:
    app: tlsversion
  ports:
    - name: https
      port: 443
      targetPort: https
    - name: http
      port: 80
      targetPort: http
---
# HTTP/3 (QUIC): UDP 443 to the pods' HTTP/3 listener, on the same static IP
# as the TCP Service above. See that Service's comment for why this is split
# out rather than being a third port there.
apiVersion: v1
kind: Service
metadata:
  name: tlsversion-udp
  namespace: prod
  labels:
    app: tlsversion
spec:
  type: LoadBalancer
  loadBalancerIP: 34.42.103.207
  selector:
    app: tlsversion
  ports:
    - name: http3
      port: 443
      protocol: UDP
      targetPort: http3
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tlsversion
  namespace: prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tlsversion
