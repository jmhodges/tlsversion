# Desired state for tlsversion in the `prod` namespace of the `dg` GKE cluster.
#
# This file is the source of truth: CI substitutes the freshly-built image
# digest in place of the `__IMAGE__` sentinel and runs `kubectl apply`, so every
# field below is reconciled on every deploy to main. There is no manual
# `kubectl edit` drift to worry about.
#
# BOOTSTRAP: the tlsversion-deploy service account CI uses can only *patch*
# these objects, not create them (its RBAC role in founding's terraform grants
# update/patch/delete, not create -- create can't be scoped to named objects).
# So each resource here must be created once by hand with an admin identity
# before CI can manage it. Same goes for any *new* resource kind added later:
# apply it once yourself, then CI takes over. Use the command below to bootstrap.
#
# To apply by hand (bootstrap, or a config change you want to test pre-merge):
#   IMAGE=us-central1-docker.pkg.dev/personal-sites-1295/deploys/tlsversion:latest
#   sed "s|__IMAGE__|$IMAGE|g" k8s/deployment.yaml | kubectl apply -f -
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tlsversion
  namespace: prod
  labels:
    app: tlsversion
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: tlsversion
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 0
  minReadySeconds: 15
  template:
    metadata:
      labels:
        app: tlsversion
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: tlsversion
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 10443
            - name: http
              containerPort: 8080
          env:
            # Consumed by the Dockerfile ENTRYPOINT:
            #   -canonicalDomain=$TLSVERSION_DOMAIN
            #   -acmeRedirect=$ACME_REDIRECT_URL
            - name: TLSVERSION_DOMAIN
              value: tlsversion.com
            - name: ACME_REDIRECT_URL
              value: http://le.somethingsimilar.com/
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
          # `/healthcheck` is served by the plaintext mux on the http port, so
          # probes don't need to deal with the self-signed-at-rest TLS cert.
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # Give the load balancer time to drop this pod before it stops
            # serving, so in-flight requests aren't cut off during a rollout.
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          volumeMounts:
            - name: tlsversion-tls
              mountPath: /secrets/tlsversion-tls
              readOnly: true
      volumes:
        - name: tlsversion-tls
          secret:
            secretName: tlsversion-tls
---
apiVersion: v1
kind: Service
metadata:
  name: tlsversion
  namespace: prod
  labels:
    app: tlsversion
spec:
  # The pod terminates TLS itself on 10443 and redirects :8080 -> https, so the
  # LoadBalancer passes both ports straight through. Point the tlsversion.com
  # DNS A record at this Service's external IP. To pin a reserved static IP,
  # set `loadBalancerIP:` here (or the GKE static-IP annotation).
  type: LoadBalancer
  selector:
    app: tlsversion
  ports:
    - name: https
      port: 443
      targetPort: https
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tlsversion
  namespace: prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tlsversion
