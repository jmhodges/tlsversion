name: Build and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Google OIDC workload identity
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...

  deploy:
    name: Deploy
    needs: build
    # Only deploy on merges to main, never on pull_request builds.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: "projects/852340051888/locations/global/workloadIdentityPools/github-deploy/providers/github-deploy"
          service_account: "tlsversion-deploy@personal-sites-1295.iam.gserviceaccount.com"
          create_credentials_file: true

      - id: get-gke-credentials
        uses: google-github-actions/get-gke-credentials@v3.0.0
        with:
          cluster_name: dg
          location: us-central1-c

      - run: gcloud auth configure-docker -q us-central1-docker.pkg.dev

      - id: build-push
        run: |
          REPO=us-central1-docker.pkg.dev/personal-sites-1295/deploys/tlsversion
          docker build -t "$REPO:v1-${GITHUB_SHA}" .
          docker push "$REPO:v1-${GITHUB_SHA}"
          # Pin the deploy to the immutable digest rather than the mutable tag.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$REPO:v1-${GITHUB_SHA}")
          echo "Built $DIGEST"
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"

      - id: deploy
        env:
          IMAGE: ${{ steps.build-push.outputs.image }}
        run: |
          # Substitute the pinned digest into the checked-in desired state, then
          # apply it. Everything in k8s/deployment.yaml is reconciled in one
          # apply, so a single rollout covers both code and config changes.
          sed "s|__IMAGE__|${IMAGE}|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl -n prod rollout status --timeout=5m deployment/tlsversion
