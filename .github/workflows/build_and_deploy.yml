name: Build and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Google OIDC workload identity
  contents: read

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  deploy:
    name: Deploy
    needs: build
    # Only deploy on merges to main, never on pull_request builds.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - uses: actions/checkout@v6
        with:
          # Need the parent commit so we can use its already-built image as a
          # buildx --cache-from source (see the build-push step below).
          fetch-depth: 2

      - uses: docker/setup-buildx-action@v3
      # Exposes ACTIONS_RUNTIME_TOKEN / cache URL to later steps so the raw
      # `docker buildx build` below can read and write the type=gha cache.
      - uses: crazy-max/ghaction-github-runtime@v3

      - id: auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: "projects/852340051888/locations/global/workloadIdentityPools/github-deploy/providers/github-deploy"
          service_account: "tlsversion-deploy@personal-sites-1295.iam.gserviceaccount.com"
          create_credentials_file: true

      - id: get-gke-credentials
        uses: google-github-actions/get-gke-credentials@v3.0.0
        with:
          cluster_name: dg
          location: us-central1-c

      - run: gcloud auth configure-docker -q us-central1-docker.pkg.dev

      - id: build-push
        run: |
          REPO=us-central1-docker.pkg.dev/personal-sites-1295/deploys/tlsversion
          TAG="$REPO:v1-${GITHUB_SHA}"
          # On a re-run the tag already exists, and the repo has tag immutability
          # enabled, so re-pushing it would fail. Reuse the existing digest
          # instead of rebuilding.
          if DIGEST=$(gcloud artifacts docker images describe "$TAG" \
                --format='value(image_summary.fully_qualified_digest)' 2>/dev/null); then
            echo "Reusing existing image $DIGEST"
          else
            # Cache sources: the parent commit's image (carries an inline cache,
            # so its layers -- notably the apt-get install -- are reused without
            # re-running) plus the GitHub Actions cache (covers the Go build
            # stage, which inline cache can't). The repo has immutable tags, so
            # we deliberately avoid a moving :buildcache tag / registry mode=max:
            # each v1-<sha> tag is unique, and type=inline rides inside it.
            PARENT_SHA=$(git rev-parse HEAD^ 2>/dev/null || true)
            docker buildx build \
              ${PARENT_SHA:+--cache-from "type=registry,ref=$REPO:v1-$PARENT_SHA"} \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --cache-to type=inline \
              -t "$TAG" \
              --metadata-file meta.json \
              --push \
              .
            # buildx --push doesn't load the image locally, so read the pushed
            # digest from the build metadata. Pin the deploy to that immutable
            # digest rather than the mutable tag.
            DIGEST="$REPO@$(jq -r '."containerimage.digest"' meta.json)"
            echo "Built $DIGEST"
          fi
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"

      - id: deploy
        env:
          IMAGE: ${{ steps.build-push.outputs.image }}
        run: |
          # Substitute the pinned digest into the checked-in desired state, then
          # apply it. Everything in k8s/deployment.yaml is reconciled in one
          # apply, so a single rollout covers both code and config changes.
          sed "s|__IMAGE__|${IMAGE}|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl -n prod rollout status --timeout=5m deployment/tlsversion
